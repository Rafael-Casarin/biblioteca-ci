name: Testes-ci

on:
  push:
    branches: ["main", "teste"]
  pull_request:

jobs:
  testes-unitarios:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install -r requirements-dev.txt
      - run: pytest -v
      - run: ruff check .
  imagem:
    needs: testes-unitarios
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - run: docker build -t biblioteca-ci:test .
      - run: docker run -d --name biblioteca-ci -p 8000:8000 biblioteca-ci:test
      - name: Verificar saude da API
        run: >-
          curl --fail --show-error --silent
          --retry 10 --retry-delay 2 --retry-all-errors
          --connect-timeout 2 --max-time 5
          http://localhost:8000/saude
      - name: Exibir logs em caso de falha
        if: failure()
        run: docker logs biblioteca-ci
      - name: Remover container
        if: always()
        run: docker rm -f biblioteca-ci
